name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (simulator core)
        run: npm run test:unit
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Interface tests
        run: npm run test:ui

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        shell: bash
        run: |
          # Everything except development files, so new tools are included automatically.
          shopt -s extglob
          mkdir _site
          cp -r !(_site|node_modules|tests|scripts|test-results|playwright-report|package.json|package-lock.json|playwright.config.js|*.md) _site/
          # Every page the home page links to must be in the site.
          for path in $(grep -o 'href="[a-z-]*/"' index.html | cut -d'"' -f2); do
            test -f "_site/${path}index.html" || { echo "Missing from the site: ${path}"; exit 1; }
          done
          ls _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
