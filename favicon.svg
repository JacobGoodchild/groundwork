<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Groundwork: bricks built up from a solid base, with the newest (gold) on top. Drawn on a 16-pixel grid so it stays crisp in a browser tab. -->
  <rect width="16" height="16" rx="3.5" fill="#0b6b64"/>
  <g fill="#f7f6f2">
    <rect x="1" y="11" width="4" height="3" rx="0.6"/>
    <rect x="6" y="11" width="4" height="3" rx="0.6"/>
    <rect x="11" y="11" width="4" height="3" rx="0.6"/>
    <rect x="3" y="7" width="4" height="3" rx="0.6"/>
    <rect x="9" y="7" width="4" height="3" rx="0.6"/>
  </g>
  <rect x="6" y="3" width="4" height="3" rx="0.6" fill="#f2c14e"/>
</svg>
